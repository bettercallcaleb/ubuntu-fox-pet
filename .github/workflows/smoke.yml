name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6
      - name: Compile and smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 -m py_compile pet.py room.py
          /usr/bin/python3 tests/smoke.py
          /usr/bin/python3 tests/room_smoke.py
          /usr/bin/python3 tests/photo_room_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 3D runtime and assets
        run: |
          cd real3d
          npm ci --ignore-scripts --no-audit --no-fund
          node --check scene.js
          node --check grounded-gait-v13.js
          node --check navigation-v13.js
          node check-v13.mjs
          node check-facing-v16.mjs
          node check-turn-v17.mjs
          node --check turn-contact-v17.js
          node --check grounded-gait-v13.js
          test -s docs/v17-turning-before-after.jpg
          test -s docs/v17-turn-stable-real-time.mp4
          test -s docs/v16-fox-visual-orientation-fix.jpg
          test -s docs/v16-fox-face-me-confirmed.png
          test -s docs/v16-face-me-model-correction.mp4
          node --check fox-facing-v16.js
          node --check living-motion-v14.js
          test -s docs/v16-fox-4-directions.jpg
          test -s docs/v16-fox-full-direction-demo.mp4
          test -s docs/v13-grounded-fox-interactions.mp4
          test -s docs/v13-grounded-fox-showcase.jpg
          node rtx4090/check-gallery.mjs
          bash -n rtx4090/launch.sh rtx4090/install.sh rtx4090/reproduce.sh
          node --check neural/main.js
          node neural/check-neural.mjs
          bash -n neural/install.sh neural/launch.sh
          node --check room-v8.js
          node --check fur.js
          node check-assets.mjs
          test -s docs/v12-real-fox-animation.mp4
          test -s docs/v12-fox-4090-optix.png
          test -s assets/Fox.glb
          test -s assets/CREDITS.md
          bash -n launch.sh install.sh
